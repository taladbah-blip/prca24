openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: PRCA-24 Arabic Survey API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: responses
    description: Survey response operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /responses:
    post:
      operationId: submitResponse
      tags: [responses]
      summary: Submit a survey response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveyResponseInput"
      responses:
        "201":
          description: Response saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyResponse"
        "400":
          description: Validation error
    get:
      operationId: listResponses
      tags: [responses]
      summary: List all survey responses
      responses:
        "200":
          description: List of responses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SurveyResponse"
  /responses/stats:
    get:
      operationId: getStats
      tags: [responses]
      summary: Get aggregate statistics
      responses:
        "200":
          description: Aggregate stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyStats"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SurveyResponseInput:
      type: object
      required:
        - answers
      properties:
        respondentName:
          type: ["string", "null"]
        answers:
          type: array
          items:
            type: integer
          minItems: 24
          maxItems: 24
          description: "Array of 24 answers, values 1-5 (1=strongly agree, 5=strongly disagree)"
    SurveyResponse:
      type: object
      required:
        - id
        - answers
        - totalScore
        - groupDiscussionScore
        - meetingsScore
        - interpersonalScore
        - publicSpeakingScore
        - apprehensionLevel
        - createdAt
      properties:
        id:
          type: integer
        respondentName:
          type: ["string", "null"]
        answers:
          type: array
          items:
            type: integer
        totalScore:
          type: number
        groupDiscussionScore:
          type: number
        meetingsScore:
          type: number
        interpersonalScore:
          type: number
        publicSpeakingScore:
          type: number
        apprehensionLevel:
          type: string
          description: "low | moderate | high"
        createdAt:
          type: string
    SurveyStats:
      type: object
      required:
        - totalSubmissions
        - averageTotalScore
        - averageGroupDiscussion
        - averageMeetings
        - averageInterpersonal
        - averagePublicSpeaking
        - lowCount
        - moderateCount
        - highCount
      properties:
        totalSubmissions:
          type: integer
        averageTotalScore:
          type: number
        averageGroupDiscussion:
          type: number
        averageMeetings:
          type: number
        averageInterpersonal:
          type: number
        averagePublicSpeaking:
          type: number
        lowCount:
          type: integer
        moderateCount:
          type: integer
        highCount:
          type: integer
